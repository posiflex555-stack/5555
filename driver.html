<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>فاتورة السائق</title>

<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">

</head>

<body>

<header>

<button class="backBtn" onclick="history.back()">
⬅ رجوع
</button>

<h2 id="driverTitle">اسم السائق</h2>

</header>

<div class="totalBox">

<div class="totalTitle">
إجمالي الفاتورة
</div>

<h1 id="totalPrice">
0 ريال
</h1>

</div>

<!-- قسم الدجاج -->

<div class="section">

<div class="sectionTitle" onclick="toggleSection('chickenSection')">

🍗 قسم الدجاج

</div>

<div class="sectionBody" id="chickenSection">

</div>

</div>

<!-- قسم الإيدامات -->

<div class="section">

<div class="sectionTitle" onclick="toggleSection('edamatSection')">

🥘 قسم الإيدامات

</div>

<div class="sectionBody" id="edamatSection">

</div>

</div>

<!-- قسم المشروبات -->

<div class="section">

<div class="sectionTitle" onclick="toggleSection('drinkSection')">

🥤 قسم المشروبات

</div>

<div class="sectionBody" id="drinkSection">

</div>

</div>

<!-- قسم المقبلات -->

<div class="section">

<div class="sectionTitle" onclick="toggleSection('starterSection')">

🥗 قسم المقبلات

</div>

<div class="sectionBody" id="starterSection">

</div>

</div>

<div class="bottomButtons">

<button id="saveInvoice">

💾 حفظ الفاتورة

</button>

<button id="sendWhatsapp">

📲 إرسال للسائق

</button>

<button id="clearInvoice">

🗑️ مسح الفاتورة

</button>

</div>

<script src="driver.js"></script>

</body>

</html>
