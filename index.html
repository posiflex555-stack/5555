<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>
فواتير السواقين
</title>

<meta name="theme-color"
content="#0d6efd">

<meta
name="apple-mobile-web-app-capable"
content="yes">

<meta
name="apple-mobile-web-app-status-bar-style"
content="default">

<meta
name="apple-mobile-web-app-title"
content="فواتير السواقين">

<link rel="manifest"
href="manifest.json">

<link
rel="stylesheet"
href="style.css">

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap"
rel="stylesheet">

</head>

<body>

<header class="top-header">

<div class="header-title">

🚚 إدارة فواتير السواقين

</div>

<div class="header-buttons">

<button
id="settingsBtn">

⚙️ الإعدادات

</button>

</div>

</header>

<main class="container">

<section class="card">

<h2>

إضافة سائق جديد

</h2>

<div class="form-group">

<label>

اسم السائق

</label>

<input
type="text"
id="driverName"
placeholder="مثال : فؤاد">

</div>

<div class="form-group">

<label>

رقم الجوال

</label>

<input
type="tel"
id="driverPhone"
placeholder="05xxxxxxxx">

</div>

<button
id="addDriverBtn"
class="primary-btn">

➕ إضافة السائق

</button>

</section>

<section class="card">

<div class="toolbar">

<input

id="searchDriver"

type="text"

placeholder="بحث باسم السائق">

<button

id="sendAllBtn"

class="green-btn">

📤 إرسال جميع الفواتير

</button>

</div>

</section>

<section>

<div

id="driversList"

class="drivers-list">

</div>

</section>

</main>
<!-- نافذة تعديل بيانات السائق -->

<div id="editModal" class="modal">

<div class="modal-box">

<h2>

تعديل بيانات السائق

</h2>

<div class="form-group">

<label>

اسم السائق

</label>

<input
type="text"
id="editDriverName">

</div>

<div class="form-group">

<label>

رقم الجوال

</label>

<input
type="tel"
id="editDriverPhone">

</div>

<div class="modal-buttons">

<button
id="saveEditBtn"
class="primary-btn">

💾 حفظ

</button>

<button
id="cancelEditBtn"
class="danger-btn">

إلغاء

</button>

</div>

</div>

</div>

<!-- نافذة حذف السائق -->

<div
id="deleteModal"
class="modal">

<div class="modal-box">

<h2>

حذف السائق

</h2>

<p>

هل أنت متأكد من حذف السائق؟

</p>

<div class="modal-buttons">

<button
id="confirmDeleteBtn"
class="danger-btn">

🗑 حذف

</button>

<button
id="cancelDeleteBtn"
class="gray-btn">

إلغاء

</button>

</div>

</div>

</div>

<footer class="footer">

مطاعم ومطابخ سحايب ديرتي

<br>

إدارة فواتير السواقين

</footer>
<!-- تحميل ملفات JavaScript -->

<script src="data.js"></script>

<script src="script.js"></script>

<script>

if ("serviceWorker" in navigator) {

window.addEventListener("load", () => {

navigator.serviceWorker.register("sw.js")

.then(() => {

console.log("Service Worker Registered");

})

.catch((err) => {

console.log(err);

});

});

}

</script>

</body>

</html>
